insmod all_video
insmod vbe
insmod vga
insmod multiboot
set gfxmode=auto
set timeout=3
set default=0

menuentry "EndixOS v8 (netbook 1024x600 via 800x600, undistorted)" {
    set gfxpayload=800x600x32
    multiboot /boot/endixos.elf wide
    module /boot/endixos.elf endixos.elf
    boot
}
menuentry "EndixOS v8 (800x600 - old netbooks)" {
    set gfxpayload=800x600x32
    multiboot /boot/endixos.elf
    module /boot/endixos.elf endixos.elf
    boot
}
menuentry "EndixOS v8 (1024x768, safe)" {
